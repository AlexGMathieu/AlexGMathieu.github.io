<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexandre Mathieu — Développeur d'applications IA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Google Analytics 4 — Consent Mode v2
         analytics_storage: 'denied' par défaut ; mis à jour après consentement -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZVXFRV9Z3V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('consent', 'default', { analytics_storage: 'denied' });
      gtag('config', 'G-ZVXFRV9Z3V');
    </script>
    <!-- GitHub Pages SPA — restauration de l'URL
         Doit s'exécuter de façon synchrone, avant le module React,
         pour que routeFromUrl() dans App.jsx lise le bon pathname. -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (!p) return;
        // Reconstruit l'URL propre à partir des paramètres encodés par 404.html
        var q = params.get('q');
        var url = decodeURIComponent(p) + (q ? '?' + decodeURIComponent(q) : '');
        window.history.replaceState(null, '', url);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
